[workspace]
resolver = "2"
members = ["crates/*"]
# ziggurat-ot (and its ziggurat-ncp-api / ziggurat-phy-otlink deps) only build for MCU
# targets, as the staticlib embedded in the OpenThread RCP firmware. They are excluded so
# host `cargo build` over the workspace doesn't try (and fail) to compile them.
exclude = [
    "fuzz",
    "crates/ziggurat-ncp-api",
    "crates/ziggurat-ot",
    "crates/ziggurat-phy-otlink",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.98"
edition = "2024"
license = "Apache-2.0"
authors = []
repository = "https://github.com/zigpy/ziggurat"


[workspace.dependencies]
ziggurat-ieee-802154 = { path = "crates/ziggurat-ieee-802154", version = "0.1.0" }
ziggurat-phy = { path = "crates/ziggurat-phy", version = "0.1.0" }
ziggurat-phy-spinel = { path = "crates/ziggurat-phy-spinel", version = "0.1.0", default-features = false }
ziggurat-runtime = { path = "crates/ziggurat-runtime", version = "0.1.0", default-features = false }
ziggurat-spinel = { path = "crates/ziggurat-spinel", version = "0.1.0", default-features = false }
ziggurat-zigbee = { path = "crates/ziggurat-zigbee", version = "0.1.0" }
ziggurat-driver = { path = "crates/ziggurat-driver", version = "0.1.0" }
ziggurat-protocol = { path = "crates/ziggurat-protocol", version = "0.1.0" }

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# A panic anywhere must kill the whole process instead of leaving it half-dead with
# the Spinel reader still running; the client reconnects and a supervisor restarts us
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

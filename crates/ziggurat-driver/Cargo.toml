[package]
name = "ziggurat-driver"
version.workspace = true
description = "Async (tokio) Zigbee stack driver built on the sans-io ziggurat-zigbee crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-ieee-802154.workspace = true
ziggurat-phy.workspace = true
ziggurat-runtime = { workspace = true, default-features = false }
ziggurat-zigbee.workspace = true

abstract-bits = { git = "https://github.com/puddly/abstract-bits.git", rev = "1f67dd91dce8a4c3b2c760ac317780856c1d6805", version = "0.2.0" }
arbitrary-int = "2.2.0"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

# Host (tokio) runtime backend.
rand = { version = "0.10.2", optional = true }

[features]
default = ["tokio"]
# The host runtime: tokio executor, parking_lot locks, OS randomness.
tokio = ["ziggurat-runtime/tokio", "dep:rand"]
# The embassy runtime adapter (and its no_std-friendly sync primitives), for the MCU.
# Mutually exclusive with `tokio` at the `sync`/`runtime`/`rng` seam.
embassy = ["ziggurat-runtime/embassy"]
# Run the embassy adapter on the host, bridged to a tokio reactor (for tests).
embassy-host = ["embassy", "ziggurat-runtime/embassy-host"]

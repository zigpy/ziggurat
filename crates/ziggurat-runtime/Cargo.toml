[package]
name = "ziggurat-runtime"
version.workspace = true
description = "Async runtime abstraction (executor, clock, sync primitives) for the Ziggurat Zigbee stack"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }
# Without `std`, `Notify` and `AsyncMutex` guard their bookkeeping with a critical
# section, so an interrupt can wake a task. The firmware provides the implementation.
critical-section = "1.2"

# With `std`, the blocking mutex is parking_lot's instead of a spinlock.
parking_lot = { version = "0.12.5", optional = true }

# Host (tokio) runtime backend.
rand = { version = "0.10.2", optional = true }
tokio = { version = "1.53.1", features = [
    "rt",
    "macros",
    "time",
    "sync",
    "io-util",
], optional = true }

# Embassy runtime adapter. The MCU binary provides the executor + arch (via esp-rtos), so
# the base dependency pulls no arch feature; the `embassy-host` feature adds the std
# executor so the same adapter can run on the host bridged to tokio.
embassy-executor = { version = "0.10", optional = true }
embassy-time = { version = "0.5", optional = true }

# Every feature is additive: each runtime is its own type, so one build can hold both.
[features]
default = ["tokio"]
std = ["dep:parking_lot"]
# The host runtime: tokio executor, OS randomness.
tokio = ["std", "dep:tokio", "dep:rand"]
# The embassy runtime adapter, for the MCU.
embassy = ["dep:embassy-executor", "dep:embassy-time"]
# Run the embassy adapter on the host, bridged to a tokio reactor (for tests).
embassy-host = [
    "embassy",
    "std",
    "dep:tokio",
    "embassy-executor/platform-std",
    "embassy-executor/executor-thread",
    "embassy-time/std",
]

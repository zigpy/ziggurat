[package]
name = "ziggurat-sim-rcp"
version.workspace = true
description = "Simulated OpenThread RCP that speaks Spinel to a host and puts frames on the simulation medium"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-ieee-802154.workspace = true
ziggurat-spinel.workspace = true
ziggurat-sim-proto = { path = "../ziggurat-sim-proto" }

clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.30", features = ["term", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[[bin]]
name = "ziggurat-sim-rcp"
path = "src/main.rs"
doc = false

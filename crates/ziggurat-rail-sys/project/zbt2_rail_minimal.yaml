name: Home Assistant Connect ZBT-2 RAIL Minimal
device: EFR32MG24A420F1536IM40
base_project: src/rail_minimal
filename: "{manifest_name}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.0"
toolchain: "gcc:14.2.1.20241119"

gbl:
  fw_type: rail-minimal
  baudrate: 460800

c_defines:
  # ZBT-2 HFXO (39 MHz) — required for the radio to come up.
  SL_CLOCK_MANAGER_HFXO_FREQ: 39000000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10
  SL_CLOCK_MANAGER_HFXO_CTUNE: 108

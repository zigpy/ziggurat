[package]
name = "ziggurat-rail-sys"
version = "0.1.0"
edition = "2021"
description = "FFI bindings to Silicon Labs RAIL for EFR32MG24, with the C glue compiled from vendored SDK source and linked against the precompiled RAIL library"
license = "Apache-2.0"
repository = "https://github.com/zigpy/ziggurat"
links = "rail"

# Excluded from the host workspace; builds only for thumbv8m.main-none-eabihf.
# The one prebuilt binary is vendor/lib/librail_efr32xg24_gcc_release.a; everything
# else is C glue compiled from source (see build.rs + recipe/). The SDK source root
# is configured via the ZIGGURAT_SDK_TREE env var (defaults to the vendored OpenThread
# RCP build tree during bring-up).
[dependencies]

[build-dependencies]
cc = "1.2"
bindgen = "0.70"

[package]
name = "ziggurat-server"
version.workspace = true
description = "WebSocket server exposing the Ziggurat Zigbee stack over the binary control protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-spinel.workspace = true
ziggurat-phy.workspace = true
ziggurat-phy-spinel.workspace = true
ziggurat-driver.workspace = true
ziggurat-zigbee.workspace = true
ziggurat-protocol.workspace = true

clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
cobs = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "io-std"] }
tokio-serial = "5.5"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[[bin]]
name = "ziggurat"
path = "src/main.rs"
doc = false

[package]
name = "ziggurat-spinel"
version.workspace = true
description = "Sans-io OpenThread Spinel protocol and its runtime-agnostic RCP client"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-ieee-802154.workspace = true
ziggurat-runtime.workspace = true

crc_all = "0.2.2"
embedded-io-async = "0.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false }
num_enum = { version = "0.7.6", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[features]
default = ["tokio"]
tokio = ["ziggurat-runtime/tokio"]
embassy = ["ziggurat-runtime/embassy"]

[dev-dependencies]
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "io-util", "test-util"] }
hex-literal = "1.1.0"
rand = "0.10.2"

language = "C"
include_guard = "ZIGGURAT_H_"
cpp_compat = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c"

header = """/*
 * Ziggurat embedded-in-OpenThread-RCP C API (libziggurat_ot.a).
 *
 * Generated by cbindgen from src/lib.rs and src/platform.rs.
 */"""

[export.rename]
"ZigguratRadioConfig" = "ziggurat_radio_config_t"
"ZigguratTxStatus" = "ziggurat_tx_status"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
args = "vertical"

[package]
name = "ziggurat-ot"
version = "0.1.0"
edition = "2021"
description = "Ziggurat as a staticlib embedded inside OpenThread RCP firmware"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
ziggurat-phy = { path = "../ziggurat-phy" }
ziggurat-phy-otlink = { path = "../ziggurat-phy-otlink" }
ziggurat-ieee-802154 = { path = "../ziggurat-ieee-802154" }
ziggurat-zigbee = { path = "../ziggurat-zigbee" }
ziggurat-driver = { path = "../ziggurat-driver", default-features = false, features = ["embassy"] }
ziggurat-ncp-api = { path = "../ziggurat-ncp-api" }
# No arch/executor feature: the raw executor is polled from OpenThread's superloop via
# ziggurat_process(), with __pender provided here.
embassy-executor = "0.10"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-time-driver = "0.2"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-16"] }
critical-section = "1"
embedded-alloc = "0.6"

[build-dependencies]
cbindgen = "0.29"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
# inline-asm: without it cortex-m injects prebuilt path-named archive members
# (bin/thumbv8m...o) that arm-none-eabi-objcopy --strip-debug chokes on.
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }

# ESP32-C6 (firmwares/esp32-c6): single-hart machine-mode critical section.
[target.'cfg(all(target_arch = "riscv32", target_os = "none"))'.dependencies]
riscv = { version = "0.12", features = ["critical-section-single-hart"] }

# debug = false: the firmware builder's DWARF-reproducibility check rejects the
# absolute cargo/rustup paths Rust debug info carries.
[profile.release]
opt-level = "s"
debug = false
lto = "fat"
codegen-units = 1

# Standalone workspace: only builds for thumbv8m.main-none-eabihf; excluded from the host
# workspace.
[workspace]

[package]
name = "ziggurat-phy-spinel"
version.workspace = true
description = "Spinel/OpenThread-RCP backend implementing the ziggurat-phy RadioPhy trait"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-ieee-802154.workspace = true
ziggurat-phy.workspace = true
ziggurat-runtime.workspace = true
ziggurat-spinel.workspace = true

embedded-io-async = "0.7"
tracing = { version = "0.1", default-features = false }

[features]
default = ["tokio"]
tokio = ["ziggurat-runtime/tokio", "ziggurat-spinel/tokio"]
embassy = ["ziggurat-runtime/embassy", "ziggurat-spinel/embassy"]

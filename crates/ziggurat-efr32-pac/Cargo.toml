[package]
name = "ziggurat-efr32-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for the EFR32MG24 (svd2rust-generated)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zigpy/ziggurat"

# svd2rust-generated; see REGENERATE.md. Excluded from the host workspace
# (builds only for thumbv8m.main-none-eabihf).
[dependencies]
cortex-m = "0.7.7"
vcell = "0.1.3"
critical-section = { version = "1.1", optional = true }
cortex-m-rt = { version = "0.7.5", optional = true }

[build-dependencies]
# Generates the PAC from the SVD at build time (lib API — no CLI on PATH needed).
svd2rust = "0.37"

[features]
rt = ["cortex-m-rt"]
# Thread-safe `Peripherals::take()` via critical-section. The binary crate must
# also provide a critical-section implementation (e.g. cortex-m's
# `critical-section-single-core`).
critical-section = ["dep:critical-section"]

[package.metadata.docs.rs]
features = ["rt", "critical-section"]

[package]
name = "ziggurat-phy-trel"
version.workspace = true
description = "SPIKE: TREL-like IP backbone link wrapped around a ziggurat-phy RadioPhy"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ziggurat-ieee-802154.workspace = true
ziggurat-phy.workspace = true

parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "net", "macros"] }
tracing = "0.1"
mdns-sd = "0.21.7"
if-addrs = "0.15"
socket2 = { version = "0.6.5", features = ["all"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
rcgen = "0.13"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

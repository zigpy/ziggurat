name: xG24 Dev Kit (BRD2601B) Ziggurat OpenThread RCP
device: EFR32MG24B310F1536IM48
base_project: src/openthread_rcp
filename: "{manifest_name}_{ot_rcp_version.split('/')[-1]}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.0"
toolchain: "gcc:14.2.1.20241119"

sdk_extension:
  - id: ziggurat
    version: 1.0.0
    vendor: nabucasa

gbl:
  fw_type: openthread_rcp
  ot_rcp_version: dynamic
  baudrate: 115200

add_components:
- id: ziggurat_stack
  vendor: nabucasa
  package: ziggurat


configuration:
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_NONE

c_defines:
  # The SDK default 4 KiB main stack overflows during energy scans and broadcasts
  SL_STACK_SIZE: 16384

  SL_CLOCK_MANAGER_HFXO_FREQ: 39000000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 50
  SL_CLOCK_MANAGER_HFXO_CTUNE: 140

  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART0
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 5
  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 6
  SL_IOSTREAM_EUSART_VCOM_RX_BUFFER_SIZE: 512
